{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish — CookBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm p-4" style="border-radius: var(--cb-radius)">
      <h2 class="mb-4">Ro'yxatdan o'tish</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <div class="text-danger small">{{ error }}</div>
            {% endfor %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-cb w-100">Ro'yxatdan o'tish</button>
      </form>
      <p class="mt-3 mb-0 text-center">
        Akkauntingiz bormi? <a href="{% url 'accounts:login' %}">Kirish</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
